[project]
name = "ThePromptDefence"
version = "0.1.4"
description = "A Local-First, Zero-Cost Prompt Injection Detection Server for the Model Context Protocol."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Aniket Karne", url = "https://github.com/aniketkarne"}
]
keywords = ["security", "prompt-injection", "mcp", "llm", "jailbreak-detection", "ai-safety"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    # mcp<2: src/shield_mcp/server.py imports `mcp.server.fastmcp.FastMCP`,
    # which was renamed to `mcp.server.mcpserver.MCPServer` in mcp 2.x. Without
    # this pin, a fresh `pip install` on Sept 2026 resolves to mcp 2.0+ and the
    # server crashes on import with ModuleNotFoundError. Migration to the v2
    # API is tracked as a follow-up; the pin keeps `pip install` working today.
    "mcp<2",
    "transformers",
    "torch",
    "numpy",
    "scipy",
    "safetensors",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.scripts]
ThePromptDefence = "shield_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shield_mcp"]

[project.urls]
Homepage = "https://github.com/aniketkarne/ThePromptDefence"
Documentation = "https://github.com/aniketkarne/ThePromptDefence#readme"
Repository = "https://github.com/aniketkarne/ThePromptDefence"
Issues = "https://github.com/aniketkarne/ThePromptDefence/issues"
